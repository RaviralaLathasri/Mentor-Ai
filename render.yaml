services:
  - type: web
    name: mentor-ai-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mentor-ai-db
          property: connectionString
      - key: CORS_ALLOW_ORIGINS
        value: "*"
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: mentor-ai-db
    plan: free
